<section class="container">
  <h1>Map</h1>
  <div class="row my-2 justify-content-center fade" id="map-filters">
    <div class="col-md-6 bg-light p-2 rounded-2">
      <div class="mb-3">
        <label for="maps-filters-input" class="form-label"
          >Search by name</label
        >
        <input type="text" class="form-control" id="heroes-filters-input" />
      </div>
      <div
        class="mb-3 bg-dark p-3 d-flex rounded-2 justify-content-evenly flex-wrap"
        id="gm-icon"
      ></div>
      <div class="mb-3">
        <button class="btn btn-warning" onclick="app.appDom.displayMapsCard()">
          Reset filters
        </button>
      </div>
    </div>
  </div>
  <div
    class="row fade justify-content-center align-items-center gap-0 rounded-2"
    id="map-list"
  ></div>
</section>
