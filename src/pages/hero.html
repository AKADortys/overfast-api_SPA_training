<section class="container">
  <div
    class="row justify-content-center align-items-center fade"
    id="hero-details"
  ></div>
  <div class="row mt-2 justify-content-center" id="heroes-filters">
    <div class="col-md-4 bg-light p-2 rounded-2">
      <div class="mb-3">
        <label for="heroes-filters-input" class="form-label"
          >Search by name</label
        >
        <input type="text" class="form-control" id="heroes-filters-input" />
      </div>
      <div
        class="mb-3 bg-dark p-3 d-flex rounded-2 justify-content-evenly"
        id="roles-icon"
      ></div>
      <div class="mb-3">
        <button
          class="btn btn-warning"
          onclick="app.appDom.displayHeroesCard()"
        >
          Reset filters
        </button>
      </div>
    </div>
  </div>
  <div
    class="row justify-content-center align-items-center rounded-2 py-2 flex-wrap mt-2"
    id="heroes-list"
  ></div>
</section>
